<svg
  width="734"
  height="140"
  viewBox="0 0 734 140"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">GitHub Contribution Streak</title>
  <desc id="descId">Grade: B-. Total contributions (last 365 days): 534. Current streak: 17 days. Longest streak: 19 days.</desc>
  <style>
    .stat-value { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2f80ed; }
    .stat-label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58; }
    .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="733" height="139" stroke="#e4e2e2" fill="#fffefe" stroke-opacity="1" />

  <g data-testid="rank-circle">
    <circle cx="75" cy="70" r="40" stroke="#2f80ed" stroke-width="6" fill="none" opacity="0.2" />
    <circle cx="75" cy="70" r="40" stroke="#2f80ed" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"
      stroke-dasharray="250" stroke-dashoffset="161.93861872962137"
      transform="rotate(-90 75 70)" />
    <text x="75" y="71" text-anchor="middle" alignment-baseline="central" dominant-baseline="central" class="rank-text">B-</text>
  </g>

  <line x1="150" y1="15" x2="150" y2="125" stroke="#e4e2e2" stroke-width="1" />
  <line x1="344.66666666666663" y1="25" x2="344.66666666666663" y2="115" stroke="#e4e2e2" stroke-width="1" />
  <line x1="539.3333333333334" y1="25" x2="539.3333333333334" y2="115" stroke="#e4e2e2" stroke-width="1" />

  
    <g transform="translate(247.33333333333331, 40)">
      <text x="0" y="30" text-anchor="middle" class="stat-value">534</text>
      <text x="0" y="50" text-anchor="middle" class="stat-label">Total Contributions (365d)</text>
    </g>
  
    <g transform="translate(442, 40)">
      <text x="0" y="30" text-anchor="middle" class="stat-value">17</text>
      <text x="0" y="50" text-anchor="middle" class="stat-label">Current Streak (days)</text>
    </g>
  
    <g transform="translate(636.6666666666667, 40)">
      <text x="0" y="30" text-anchor="middle" class="stat-value">19</text>
      <text x="0" y="50" text-anchor="middle" class="stat-label">Longest Streak (days)</text>
    </g>
</svg>
