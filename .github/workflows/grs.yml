name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=true&line_height=32
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_title=true&layout=pie&card_width=220
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate total contributions (last 365 days) badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          FROM=$(date -u -d '-365 days' +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          QUERY='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions}}}}'
          PAYLOAD=$(jq -n --arg q "$QUERY" --arg login "$LOGIN" --arg from "$FROM" --arg to "$TO" \
            '{query:$q, variables:{login:$login, from:$from, to:$to}}')

          RESPONSE=$(curl -s -H "Authorization: bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" https://api.github.com/graphql)

          TOTAL=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "Failed to fetch total contributions. Response: $RESPONSE"
            exit 1
          fi

          curl -s "https://img.shields.io/badge/Total%20Contributions%20%28last%20365%20days%29-${TOTAL}-2E9EF7?style=flat-square&labelColor=0d1117" \
            -o assets/contributions.svg

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/contributions.svg
          git commit -m "Update README stats card" || exit 0
          git push
