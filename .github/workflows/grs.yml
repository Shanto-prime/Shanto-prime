name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats data (for the rank grade)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=true&line_height=32
          path: assets/.stats-raw.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Fetch top languages data
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_title=true&layout=donut&langs_count=6
          path: assets/.top-langs-raw.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Render top languages as a donut card
        run: node scripts/render-top-langs.mjs assets/.top-langs-raw.svg assets/top-langs.svg

      - name: Fetch contribution calendar (last 365 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          FROM=$(date -u -d '-365 days' +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          QUERY='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount color}}}}}}'
          PAYLOAD=$(jq -n --arg q "$QUERY" --arg login "$LOGIN" --arg from "$FROM" --arg to "$TO" \
            '{query:$q, variables:{login:$login, from:$from, to:$to}}')

          RESPONSE=$(curl -s -H "Authorization: bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" https://api.github.com/graphql)

          TOTAL=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "Failed to fetch contribution calendar. Response: $RESPONSE"
            exit 1
          fi

          echo "$RESPONSE" > assets/.contribution-calendar.json

      - name: Render grade + streak bar
        run: node scripts/render-streak.mjs assets/.stats-raw.svg assets/.contribution-calendar.json assets/streak.svg

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f assets/.stats-raw.svg assets/.top-langs-raw.svg assets/.contribution-calendar.json assets/contributions.svg assets/stats.svg
          git add assets/top-langs.svg assets/streak.svg
          git add -u assets/
          git commit -m "Update README stats card" || exit 0
          git push
